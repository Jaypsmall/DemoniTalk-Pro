name: demonitalk_pro
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/demoni_avatar.svg
    - assets/SVGs/demoni11.svg
    - assets/SVGs/demoni22.svg
    - assets/SVGs/demoni33.svg
    - assets/SVGs/demoni44.svg
    - assets/icono_demoni.png
    - assets/icono_demoni2.png

# Configuración del paquete de iconos (va al final del todo)
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  ios: true